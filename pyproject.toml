[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[project]
name = "changelog-slugs"
version = "0.2.0"
description = "Changelog-aware heading slugs for Python-Markdown’s toc extension"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Johann Philipp Gorzny", email = "jo-phil@gorzny.de"}
]

requires-python = ">=3.11"
dependencies = [
    "markdown>=3.4.2",
]

keywords = ["changelog", "keep-a-changelog", "markdown", "anchors", "slugify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://jo-phil.github.io/changelog-slugs/"
Repository = "https://github.com/jo-phil/changelog-slugs"
Issues = "https://github.com/jo-phil/changelog-slugs/issues"
Changelog = "https://jo-phil.github.io/changelog-slugs/changelog/"

[dependency-groups]
dev = [
    "ruff==0.15.17",
    { include-group = "test" },
]
test = [
    "beautifulsoup4==4.15.0",
    "pytest==9.1.0",
    { include-group = "integration" },
]
integration = [
    "mkdocs>=1.4.2",
    "zensical>=0.0.12",
]
docs = [
    "mkdocstrings-python==2.0.4",
    "zensical==0.0.45",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing-trailing-comma, handled by formatter
    "E501",     # line-too-long, handled by formatter

    # irrelevant
    "AIR", "ASYNC", "DJ", "FAST", "NPY", "PD", "PYI",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "INP001", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
